<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cadastro')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="container cartao">
    <h1>Cadastro</h1>

    <p class="alerta erro" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">
        <span class="campo-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}">
        <span class="campo-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}">
        <span class="campo-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>

        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}">
        <span class="campo-erro" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></span>

        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</main>

</body>
</html>
