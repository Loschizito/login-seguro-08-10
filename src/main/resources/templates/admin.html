<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Administração')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="container">
    <h1>Administração</h1>
    <p>Gerencie o perfil de cada usuário.</p>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <form th:action="@{/admin/usuarios/{id}/role(id=${u.id})}" method="post" class="form-linha">
                    <select name="role">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option>
                    </select>
                    <button type="submit">Salvar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
