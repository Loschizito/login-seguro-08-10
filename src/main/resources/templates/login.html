<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="container cartao">
    <h1>Entrar</h1>

    <p class="alerta erro" th:if="${param.erro}">E-mail ou senha inválidos.</p>
    <p class="alerta sucesso" th:if="${param.saiu}">Você saiu do sistema.</p>
    <p class="alerta sucesso" th:if="${param.cadastrado}">Cadastro realizado. Faça o login.</p>

    <form th:action="@{/login}" method="post">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Entrar</button>
    </form>

    <p>Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
</main>

</body>
</html>
