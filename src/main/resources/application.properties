spring.config.import=optional:file:.env[.properties]
spring.application.name=login-seguro

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:loginseguro}
spring.data.mongodb.auto-index-creation=true

spring.session.mongodb.collection-name=sessoes
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

app.nome=Login Seguro
app.tema=${APP_TEMA:padrao}
app.admin.email=${ADMIN_EMAIL:admin@loginseguro.com}
app.admin.senha=${ADMIN_SENHA}
